version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: videoai
      POSTGRES_PASSWORD: videoai
      POSTGRES_DB: videoai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - outputs:/app/outputs
      - model_cache:/app/model_cache
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://videoai:videoai@postgres:5432/videoai
      - DATABASE_URL_SYNC=postgresql+psycopg2://videoai:videoai@postgres:5432/videoai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    volumes:
      - ./backend:/app
      - outputs:/app/outputs
      - model_cache:/app/model_cache
    env_file: .env
    depends_on:
      - api
      - redis
    restart: unless-stopped
    environment:
      - DATABASE_URL_SYNC=postgresql+psycopg2://videoai:videoai@postgres:5432/videoai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - PYTHONPATH=/app

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - HOSTNAME=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  outputs:
  model_cache:
